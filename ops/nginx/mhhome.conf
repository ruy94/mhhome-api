map $http_upgrade $mhhome_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name www.admin.mhhome.shop;
    return 301 https://admin.mhhome.shop$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.admin.mhhome.shop;
    ssl_certificate /etc/letsencrypt/live/mhhome.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mhhome.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://admin.mhhome.shop$request_uri;
}

server {
    listen 80;
    server_name www.mhhome.shop;
    server_tokens off;

    return 301 https://mhhome.shop$request_uri;
}

server {
    listen 80;
    server_name mhhome.shop admin.mhhome.shop server.mhhome.shop media.mhhome.shop;
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name server.mhhome.shop;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/mhhome.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mhhome.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    # Keep published URLs and existing mini-app versions working after the migration.
    location ^~ /public/images/videos/ {
        proxy_pass http://127.0.0.1:9999/mhhome-media/videos/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # Keep published URLs and existing mini-app versions working after the migration.
    location ^~ /public/images/thumbnails/ {
        proxy_pass http://127.0.0.1:9999/mhhome-media/thumbnails/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # Keep published URLs and existing mini-app versions working after the migration.
    location ^~ /public/images/ {
        proxy_pass http://127.0.0.1:9999/mhhome-media/images/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:50006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mhhome_connection_upgrade;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443 ssl http2;
    server_name admin.mhhome.shop;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/mhhome.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mhhome.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/mhhome-admin/current;
    index index.html;

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

server {
    listen 443 ssl http2;
    server_name mhhome.shop;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/mhhome.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mhhome.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/mhhome-website/current;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    location ^~ /_nuxt/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

server {
    listen 443 ssl http2;
    server_name www.mhhome.shop;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/mhhome.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mhhome.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://mhhome.shop$request_uri;
}

server {
    listen 443 ssl http2;
    server_name media.mhhome.shop;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/mhhome.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mhhome.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
